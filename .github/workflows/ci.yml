name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v7
      - name: Install ShellCheck
        run: apt-get update && apt-get install -y --no-install-recommends shellcheck
      - name: Run ShellCheck
        run: shellcheck --severity=warning update_system.sh tests/run_tests.sh

  test:
    name: test (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:bookworm", "debian:trixie"]
    container: ${{ matrix.image }}
    env:
      UPDATER_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Run the integration tests
        run: bash tests/run_tests.sh
